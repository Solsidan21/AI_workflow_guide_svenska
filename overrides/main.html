{% extends "base.html" %}

{#- Verifiering för Google Search Console. Koden sätts i mkdocs.yml under extra.google_site_verification. -#}
{% block extrahead %}
  {{ super() }}
  {% if config.extra.google_site_verification %}
    <meta name="google-site-verification" content="{{ config.extra.google_site_verification }}">
  {% endif %}
{% endblock %}
