site_name: "AI-workflowguide på svenska: från chatt till eget system"
site_url: https://solsidan21.github.io/AI_workflow_guide_svenska/
site_description: Så bygger du ditt eget AI-system med en vanlig prenumeration, med plugget som exempel
repo_url: https://github.com/Solsidan21/AI_workflow_guide_svenska
repo_name: Solsidan21/AI_workflow_guide_svenska
copyright: >-
  <a href="#__consent">Ändra cookie-inställningar</a> ·
  <a href="/AI_workflow_guide_svenska/integritet/">Integritet</a>

theme:
  name: material
  custom_dir: overrides
  language: sv
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Byt till mörkt läge
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Byt till ljust läge
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/begrepp.css
  - stylesheets/consent.css

not_in_nav: |
  /integritet.md

plugins:
  - search:
      lang: sv

markdown_extensions:
  - tables
  - attr_list
  - pymdownx.snippets:
      base_path: [begrepp, setup]
      check_paths: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  analytics:
    provider: google
    property: G-YDFX3B82KF
  consent:
    title: Cookies
    description: >-
      Jag vill gärna se hur guiden används och hur läsare hittar hit.
      Får jag använda Google Analytics för det? Det sätter cookies och
      skickar uppgifter om ditt besök till Google. Avvisar du laddas
      ingenting. Läs mer på sidan <a href="/AI_workflow_guide_svenska/integritet/">Integritet</a>.
    actions:
      - accept
      - reject
    cookies:
      analytics:
        name: Google Analytics
        checked: true
      github:
        name: GitHub
        checked: true
  # Fyll i koden från Search Console (bara värdet i content="..."):
  google_site_verification: "hUEKbQgmLFbhiKHtTyx-k8Jzjp6YFeoOhKEFrp8EBu4"

nav:
  - Start: index.md
  - Kom igång: kom-igang.md
  - "Del 1: Grunden":
      - "01 Från chatt till system": 01-fran-chatt-till-system.md
      - "02 Kontext i stället för långa prompter": 02-kontext.md
      - "03 Struktur som kontext": 03-struktur.md
  - "Del 2: Mitt system":
      - "04 Arkitekturen": 04-arkitekturen.md
      - "05 Individanpassad inlärning": 05-individanpassad-inlarning.md
      - "06 Hjärnan": 06-hjarnan.md
      - "07 Att bygga vidare på": 07-bygga-vidare.md
  - "Del 3: Helheten":
      - "08 Modellerna": 08-modellerna.md
      - "09 Tröskeln, inte förmågan": 09-troskeln.md
      - "10 Därför slår du i taket": 10-anvandningsgransen.md
      - "11 Vad en prenumeration räcker till": 11-vad-en-prenumeration-racker-till.md
      - "Bilaga: Arbetslivet": bilaga-arbetsliv.md
  - Ordlista: ordlista.md
